name: Backend CI

on:
  push:
    paths:
      - "back/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "back/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clinica_test
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinica -d clinica_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: back

    env:
      ENVIRONMENT: test
      DEBUG: "False"
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://clinica:clinica@localhost:5432/clinica_test
      USE_SQLITE_FOR_TESTS: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Tests
        run: python manage.py test api

      - name: Coverage
        run: |
          python -m coverage run manage.py test api
          python -m coverage report
